plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blockhero.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.blockhero.tv'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Fixed hobby key so every build can be installed over the previous one.
    signingConfigs {
        release {
            storeFile file('blockhero.jks')
            storePassword 'blockhero'
            keyAlias 'blockhero'
            keyPassword 'blockhero'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}
